# Pages CMS configuration — https://pages.cms
# Repo: tsiro66/apo-koinou (branch: master)
#
# Entries live in Astro Content Collections (src/content/*) and images in
# src/assets/* (astro:assets). Frontmatter image paths are stored relative
# to the entry .md file, hence output values like `../../assets/...`.

media:
  - name: parastaseis-media
    label: Εικόνες παραστάσεων
    input: src/assets/parastaseis
    # Entries live at src/content/parastaseis/*.md → two levels up.
    output: ../../assets/parastaseis
  - name: nea-media
    label: Εικόνες νέων
    input: src/assets/nea
    output: ../../assets/nea
  - name: logos-media
    label: Λογότυπα
    input: src/assets/logos
    output: ../../assets/logos

content:
  # ── Παραστάσεις ──────────────────────────────────────────────────────
  - name: parastaseis
    label: Παραστάσεις
    path: src/content/parastaseis
    type: collection
    filename: "{fields.slug}.md"
    view:
      fields: [thumbnail, title, year, draft]
      primary: title
      sort: [year]
      default:
        sort: year
        order: desc
    fields:
      - name: title
        label: Τίτλος
        type: string
        required: true
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        description: Μόνο λατινικοί χαρακτήρες και παύλες, π.χ. panigyri. Χρησιμοποιείται ως όνομα αρχείου και URL.
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: year
        label: Έτος
        type: number
        required: true
      - name: writer
        label: Συγγραφέας
        type: string
      - name: summary
        label: Περίληψη
        type: text
      - name: crew
        label: Συντελεστές
        description: Ρόλος + όνομα, π.χ. Σκηνοθεσία — Φώτης Λάζαρης.
        type: object
        list:
          collapsible:
            collapsed: true
        fields:
          - name: role
            label: Ρόλος
            type: string
            required: true
          - name: name
            label: Όνομα
            type: string
            required: true
      - name: performances
        label: Παραστάσεις (τόπος & χρόνος)
        type: object
        list:
          collapsible:
            collapsed: true
        fields:
          - name: venue
            label: Τόπος / Χώρος
            type: string
            required: true
          - name: date
            label: Χρόνος / Ημερομηνία
            type: date
            required: true
      - name: videoId
        label: Bunny Stream Video ID
        type: string
        description: GUID βίντεο από το Bunny Stream dashboard (πλήρη μαγνητοσκοπημένη παράσταση), π.χ. 22279b7d-56b3-4628-98f5-b773282dfbeb. Αν είναι TODO, αντικαταστήστε το.
      - name: youtubeTrailer
        label: Τρέιλερ (YouTube)
        type: string
        description: Το ID του βίντεο YouTube (π.χ. dQw4w9WgXcQ) ή ολόκληρο το link. Εμφανίζεται στη σελίδα Υλικό της παράστασης.
      - name: thumbnail
        label: Εικόνα εξωφύλλου
        type: image
        options:
          media: parastaseis-media
      - name: poster
        label: Αφίσα
        type: image
        options:
          media: parastaseis-media
      - name: gallery
        label: Φωτογραφίες
        type: image
        options:
          media: parastaseis-media
          multiple: true
      - name: syllogiPhotos
        label: Φωτογραφίες Συλλογής
        type: image
        options:
          media: parastaseis-media
          multiple: true
        description: Φωτογραφίες που εμφανίζονται ΜΟΝΟ στη σελίδα «Συλλογή» (/syllogi), όχι στη σελίδα της παράστασης. Αν το αφήσεις κενό, η Συλλογή εμφανίζει τις κανονικές Φωτογραφίες της παράστασης.
      - name: invitation
        label: Πρόσκληση
        type: image
        options:
          media: parastaseis-media
          multiple: true
      - name: program
        label: Πρόγραμμα
        type: image
        options:
          media: parastaseis-media
          multiple: true
      - name: kritikes
        label: Κριτικές
        type: object
        description: Κριτικές από οργανισμούς, ΜΜΕ, κοινό κ.λπ.
        list:
          collapsible:
            collapsed: true
        fields:
          - name: source
            label: Πηγή
            type: string
            required: true
          - name: text
            label: Κείμενο κριτικής
            type: text
            required: true
      - name: carousel
        label: Καρουζέλ αρχικής σελίδας
        type: boolean
        default: false
        description: Εμφάνιση της παράστασης στο καρουζέλ της αρχικής σελίδας (χρειάζεται εικόνα εξωφύλλου ή φωτογραφίες). Εμφανίζονται έως 5, οι πιο πρόσφατες πρώτα. Αν καμία δεν επιλεχθεί, μπαίνουν αυτόματα οι 5 πιο πρόσφατες.
      - name: draft
        label: Πρόχειρο (να μην δημοσιευτεί)
        type: boolean
        default: false

  # ── Ρεπερτόριο ─────────────────────────────────────────────────────
  # One entry per play currently in the season's repertoire. The entry
  # links to a Παραστάσεις entry (relation picker) and carries the
  # season-specific content: text, summary and upcoming show dates.
  # Title, image and crew come from the linked play entry.
  - name: repertorio
    label: Ρεπερτόριο
    path: src/content/repertorio
    type: collection
    filename: "{fields.slug}.md"
    view:
      fields: [play, draft]
      primary: play
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: play
        label: Παράσταση
        type: relation
        required: true
        description: Επιλέξτε την παράσταση από τις Παραστάσεις — τίτλος, εικόνα και συντελεστές έρχονται αυτόματα από εκεί.
        options:
          collection: parastaseis
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        description: Μόνο λατινικοί χαρακτήρες και παύλες, ιδανικά ίδιο με το slug της παράστασης, π.χ. glaros. Χρησιμοποιείται ως όνομα αρχείου και URL.
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: summary
        label: Περίληψη ρεπερτορίου
        type: text
        description: Σύντομο κείμενο για τη σελίδα του ρεπερτορίου. Αν μείνει κενό, χρησιμοποιείται η Περίληψη της παράστασης.
      - name: performances
        label: Παραστάσεις (τόπος & χρόνος)
        description: Οι επόμενες παραστάσεις της περιόδου — εμφανίζονται στη σελίδα Ρεπερτόριο, όχι στο αρχείο της παράστασης.
        type: object
        list:
          collapsible:
            collapsed: true
        fields:
          - name: venue
            label: Τόπος / Χώρος
            type: string
            required: true
          - name: date
            label: Χρόνος / Ημερομηνία
            type: date
            required: true
      - name: order
        label: Σειρά εμφάνισης
        type: number
        description: Προαιρετικό — μικρότερος αριθμός εμφανίζεται πρώτος στη σελίδα Ρεπερτόριο. Χωρίς αριθμό, οι πιο πρόσφατες παραστάσεις πάνε πρώτες.
      - name: draft
        label: Πρόχειρο (να μην δημοσιευτεί)
        type: boolean
        default: false
      - name: body
        label: Κείμενο
        type: rich-text
        description: Το κείμενο για την παράσταση στη σελίδα του ρεπερτορίου.

  # ── Νέα ─────────────────────────────────────────────────────────────
  - name: nea
    label: Νέα
    path: src/content/nea
    type: collection
    filename: "{fields.slug}.md"
    view:
      fields: [thumbnail, title, publishDate]
      primary: title
      sort: [publishDate]
      default:
        sort: publishDate
        order: desc
    fields:
      - name: title
        label: Τίτλος
        type: string
        required: true
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        description: Μόνο λατινικοί χαρακτήρες και παύλες. Χρησιμοποιείται ως όνομα αρχείου και URL.
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: publishDate
        label: Ημερομηνία δημοσίευσης
        type: date
        required: true
        description: Γεμίζει αυτόματα με τη σημερινή ημερομηνία — συνήθως δεν χρειάζεται αλλαγή.
      - name: thumbnail
        label: Εικόνα
        type: image
        options:
          media: nea-media
      - name: body
        label: Κείμενο
        type: rich-text

  # ── Σελίδες (ιστορία κ.λπ.) ──────────────────────────────────────────
  # Editing allowed; creating/renaming/deleting disabled — filenames map
  # to locale pages rendered by src/sections.
  - name: selides
    label: Σελίδες
    path: src/content/selides
    type: collection
    operations:
      create: false
      rename: false
      delete: false
    view:
      layout: tree
      primary: title
    fields:
      - name: title
        label: Τίτλος
        type: string
        required: true
      - name: seoDescription
        label: SEO Περιγραφή
        type: text
      - name: body
        label: Κείμενο
        type: rich-text
